<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Editor - Secure</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }
        .login-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); }
        .login-form { background: rgba(255,255,255,0.05); padding: 2rem; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); width: 100%; max-width: 400px; }
        .login-form h2 { text-align: center; margin-bottom: 1.5rem; color: #00d4ff; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: #aaa; }
        .form-group input { width: 100%; padding: 0.75rem; border: 1px solid #333; border-radius: 6px; background: #1e1e2f; color: #fff; }
        .form-group input:focus { outline: none; border-color: #00d4ff; }
        .btn { width: 100%; padding: 0.75rem; border: none; border-radius: 6px; background: linear-gradient(135deg, #00d4ff, #0099cc); color: #1a1a2e; font-weight: bold; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,212,255,0.3); }
        .admin-container { display: none; min-height: 100vh; background: #0f0f1a; }
        .admin-container.active { display: block; }
        .admin-header { background: linear-gradient(135deg, #1a1a2e, #16213e); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 100; }
        .admin-nav { display: flex; gap: 1rem; }
        .nav-btn { padding: 0.5rem 1rem; border: 1px solid #333; border-radius: 6px; background: #1e1e2f; color: #aaa; cursor: pointer; transition: all 0.2s; }
        .nav-btn:hover { background: #00d4ff; color: #1a1a2e; }
        .editor-container { display: flex; height: calc(100vh - 60px); }
        .sidebar { width: 280px; background: #1a1a2e; padding: 1rem; border-right: 1px solid #333; overflow-y: auto; }
        .sidebar h3 { color: #00d4ff; margin-bottom: 1rem; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        .page-item { padding: 0.75rem; margin-bottom: 0.5rem; background: #16213e; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
        .page-item:hover { background: #0f0f1a; }
        .page-item.active { background: #00d4ff; color: #1a1a2e; }
        .editor-wrapper { flex: 1; display: flex; flex-direction: column; }
        .toolbar { background: #1a1a2e; padding: 0.5rem; border-bottom: 1px solid #333; display: flex; gap: 0.25rem; flex-wrap: wrap; }
        .toolbar-btn { width: 32px; height: 32px; border: none; background: #16213e; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #aaa; transition: all 0.2s; }
        .toolbar-btn:hover { background: #00d4ff; color: #1a1a2e; }
        .content-editor { flex: 1; padding: 1rem; overflow: auto; }
        .editor { width: 100%; min-height: 600px; background: #0f0f1a; color: #eee; border: 1px solid #333; border-radius: 8px; padding: 1rem; font-family: Georgia, serif; font-size: 16px; line-height: 1.6; outline: none; }
        .editor:focus { border-color: #00d4ff; }
        .actions { padding: 1rem; background: #1a1a2e; border-top: 1px solid #333; display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .action-btn { padding: 0.75rem 1.5rem; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        .action-btn.save { background: linear-gradient(135deg, #00c853, #00e676); color: #1a1a2e; }
        .autosave-indicator { 
            display: inline-block; 
            width: 12px; 
            height: 12px; 
            border-radius: 50%; 
            background: #666; 
            margin-left: 8px; 
            vertical-align: middle;
        }
        .autosave-indicator.saved { background: #00c853; }
        .autosave-indicator.dirty { background: #ff9800; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .action-btn.download { background: linear-gradient(135deg, #ff9800, #ffb74d); color: #1a1a2e; }
        .action-btn.preview { background: linear-gradient(135deg, #2196f3, #03a9f4); color: #fff; }
        .action-btn.cancel { background: linear-gradient(135deg, #f44336, #ff5252); color: #fff; }
        .action-btn.restore { background: linear-gradient(135deg, #ff9800, #ffb74d); color: #1a1a2e; }
        .action-btn.publish { background: linear-gradient(135deg, #9c27b0, #ba68c8); color: #fff; }
        .preview-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; z-index: 1000; }
        .preview-modal.active { display: block; }
        .preview-content { max-width: 900px; margin: 2rem auto; background: #fff; padding: 2rem; border-radius: 12px; color: #000; overflow-y: auto; max-height: 90vh; }
        .close-preview { position: absolute; top: 1rem; right: 1rem; background: #f44336; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 1.2rem; }
        .notification { position: fixed; bottom: 20px; right: 20px; padding: 1rem 1.5rem; border-radius: 8px; background: #333; color: #fff; display: none; z-index: 1000; }
        .notification.show { display: block; }
        .notification.success { background: linear-gradient(135deg, #00c853, #00e676); }
        .notification.error { background: linear-gradient(135deg, #f44336, #ff5252); }
        .notification.warning { background: linear-gradient(135deg, #ff9800, #ffb74d); }
    </style>
</head>
<body>
    <div class="login-container" id="loginContainer">
        <div class="login-form">
            <h2><i class="fas fa-lock"></i> Admin Access</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
        </div>
    </div>

    <div class="admin-container" id="adminContainer">
        <div class="admin-header">
            <div><strong>Admin Editor</strong> <span id="currentPage"></span></div>
            <div class="admin-nav">
                <span id="userName">admin</span>
                <button class="nav-btn" id="logoutBtn">Logout</button>
            </div>
        </div>
        <div class="editor-container">
            <div class="sidebar">
                <h3>Pages</h3>
                <div id="pageList"></div>
            </div>
            <div class="editor-wrapper">
                <div class="toolbar">
                    <button class="toolbar-btn" title="Heading 1" onclick="formatElement('h1')"><i class="fas fa-heading"></i> H1</button>
                    <button class="toolbar-btn" title="Heading 2" onclick="formatElement('h2')"><i class="fas fa-heading"></i> H2</button>
                    <button class="toolbar-btn" title="Bold" onclick="formatElement('bold')"><b>B</b></button>
                    <button class="toolbar-btn" title="Italic" onclick="formatElement('italic')"><i>I</i></button>
                    <button class="toolbar-btn" title="Bullet List" onclick="formatElement('bullet')"><i class="fas fa-list-ul"></i></button>
                    <button class="toolbar-btn" title="Numbered List" onclick="formatElement('number')"><i class="fas fa-list-ol"></i></button>
                    <button class="toolbar-btn" title="Link" onclick="formatElement('link')"><i class="fas fa-link"></i></button>
                    <button class="toolbar-btn" title="Math Equation" onclick="formatElement('math')"><i class="fas fa-sigma-tilde"></i></button>
                </div>
                <div class="content-editor">
                    <div id="editor" class="editor" contenteditable="true"></div>
                </div>
            </div>
        </div>
        <div class="actions">
            <button class="action-btn save" onclick="saveContent()"><i class="fas fa-save"></i> Save <span class="autosave-indicator" id="autosaveIndicator"></span></button>
            <button class="action-btn download" onclick="downloadContent()"><i class="fas fa-download"></i> Download</button>
            <button class="action-btn preview" onclick="previewContent()"><i class="fas fa-eye"></i> Preview</button>
            <button class="action-btn cancel" onclick="cancelEdit()"><i class="fas fa-undo"></i> Cancel</button>
            <button class="action-btn restore" onclick="restoreVersion()"><i class="fas fa-history"></i> Restore Version</button>
            <button class="action-btn publish" onclick="publishContent()"><i class="fas fa-rocket"></i> Publish</button>
        </div>
    </div>

    <div class="preview-modal" id="previewModal">
        <div class="preview-content" id="previewContent"></div>
        <button class="close-preview" onclick="closePreview()">×</button>
    </div>

    <div class="notification" id="notification"></div>

    <script>
        const ADMIN_PASSWORD = 'pokgev-4Pimho-wixjep';
        let currentPage = '';
        let originalContent = '';
        let saveTimeout = null;
        let isDirty = false;
        
        const pages = [
            { path: 'index.html', name: 'Homepage' },
            { path: 'teaching.html', name: 'Teaching' },
            { path: 'courses/calculus-1.html', name: 'Calculus I' },
            { path: 'courses/calculus-2.html', name: 'Calculus II' },
            { path: 'courses/calculus-3.html', name: 'Calculus III' },
            { path: 'courses/linear-algebra.html', name: 'Linear Algebra' },
            { path: 'courses/real-analysis.html', name: 'Real Analysis' },
            { path: 'courses/introduction-to-proofs.html', name: 'Introduction to Proofs' },
            { path: 'courses/number-theory.html', name: 'Elementary Number Theory' },
            { path: 'courses/algebra-I.html', name: 'Algebra I' },
            { path: 'courses/algebra-II.html', name: 'Algebra II' },
            { path: 'research.html', name: 'Research' },
            { path: 'about.html', name: 'About' },
            { path: 'contact.html', name: 'Contact' },
            { path: 'notes.html', name: 'Notes' },
            { path: 'blog.html', name: 'Blog' },
            { path: 'courses/lecture-notes-1.html', name: 'Lecture Notes 1' },
            { path: 'courses/lecture-notes-2.html', name: 'Lecture Notes 2' },
            { path: 'courses/lecture-notes-3.html', name: 'Lecture Notes 3' },
            { path: 'courses/lecture-notes-4.html', name: 'Lecture Notes 4' },
            { path: 'courses/lecture-notes-5.html', name: 'Lecture Notes 5' },
            { path: 'courses/lecture-notes-6.html', name: 'Lecture Notes 6' },
            { path: 'courses/lecture-notes-7.html', name: 'Lecture Notes 7' },
            { path: 'courses/lecture-notes-8.html', name: 'Lecture Notes 8' },
            { path: 'courses/lecture-notes-9.html', name: 'Lecture Notes 9' },
            { path: 'courses/lecture-notes-10.html', name: 'Lecture Notes 10' },
            { path: 'courses/lecture-notes-11.html', name: 'Lecture Notes 11' },
            { path: 'courses/lecture-notes-12.html', name: 'Lecture Notes 12' },
            { path: 'courses/lecture-notes-13.html', name: 'Lecture Notes 13' },
            { path: 'courses/lecture-notes-14.html', name: 'Lecture Notes 14' }
        ];

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (username === 'admin' && password === ADMIN_PASSWORD) {
                loadPages();
                document.getElementById('loginContainer').style.display = 'none';
                document.getElementById('adminContainer').classList.add('active');
            } else {
                showNotification('Invalid credentials', 'error');
            }
        });

        function loadPages() {
            const pageList = document.getElementById('pageList');
            pageList.innerHTML = '';
            pages.forEach(p => {
                const item = document.createElement('div');
                item.className = 'page-item';
                item.textContent = p.name;
                item.dataset.page = p.path;
                item.addEventListener('click', () => selectPage(p.path));
                pageList.appendChild(item);
            });
            if (pages.length > 0) selectPage(pages[0].path);
        }

        function selectPage(page) {
            currentPage = page;
            document.getElementById('currentPage').textContent = page;
            document.getElementById('editor').innerHTML = '';
            
            const saved = localStorage.getItem('admin_saved_' + page);
            if (saved) {
                originalContent = saved;
                document.getElementById('editor').innerHTML = saved;
                updateIndicator();
            }
        }

        function updateIndicator() {
            const indicator = document.getElementById('autosaveIndicator');
            if (isDirty) {
                indicator.classList.remove('saved');
                indicator.classList.add('dirty');
            } else {
                indicator.classList.remove('dirty');
                indicator.classList.add('saved');
            }
        }

        function formatElement(tag) {
            const editor = document.getElementById('editor');
            const sel = window.getSelection();
            if (sel.rangeCount === 0) return;
            const range = sel.getRangeAt(0);
            
            if (tag === 'bold') {
                const bold = document.createElement('strong');
                range.deleteContents(); range.insertNode(bold);
                range.setStartAfter(bold); range.setEndAfter(bold);
                sel.removeAllRanges(); sel.addRange(range);
            } else if (tag === 'italic') {
                const italic = document.createElement('i');
                range.deleteContents(); range.insertNode(italic);
                range.setStartAfter(italic); range.setEndAfter(italic);
                sel.removeAllRanges(); sel.addRange(range);
            } else if (tag === 'bullet') {
                const ul = document.createElement('ul');
                const li = document.createElement('li'); li.textContent = 'List item';
                ul.appendChild(li); range.deleteContents(); range.insertNode(ul);
            } else if (tag === 'number') {
                const ol = document.createElement('ol');
                const li = document.createElement('li'); li.textContent = 'List item';
                ol.appendChild(li); range.deleteContents(); range.insertNode(ol);
            } else if (tag === 'link') {
                const url = prompt('Enter URL:');
                if (url) {
                    const a = document.createElement('a');
                    a.href = url; a.textContent = url;
                    range.deleteContents(); range.insertNode(a);
                }
            } else if (tag === 'math') {
                const span = document.createElement('span');
                span.className = 'math'; span.innerHTML = '$$...$$';
                range.deleteContents(); range.insertNode(span);
            } else if (tag === 'h1' || tag === 'h2') {
                const element = document.createElement(tag);
                range.deleteContents(); range.insertNode(element);
            }
        }

        function getContent() {
            return document.getElementById('editor').innerHTML;
        }

        function saveContent() {
            const content = getContent();
            if (!content) {
                showNotification('No content to save', 'error');
                return;
            }
            
            localStorage.setItem('admin_saved_' + currentPage, content);
            
            let history = JSON.parse(localStorage.getItem('admin_history') || '{}');
            if (!history[currentPage]) history[currentPage] = [];
            history[currentPage].push({ content, timestamp: new Date().toISOString() });
            localStorage.setItem('admin_history', JSON.stringify(history));
            
            originalContent = content;
            isDirty = false;
            updateIndicator();
            showNotification('Content saved to browser! Click Download to save file.', 'success');
        }

        function autoSave() {
            const content = getContent();
            if (!content || content === originalContent) return;
            
            localStorage.setItem('admin_saved_' + currentPage, content);
            
            let history = JSON.parse(localStorage.getItem('admin_history') || '{}');
            if (!history[currentPage]) history[currentPage] = [];
            history[currentPage].push({ content, timestamp: new Date().toISOString() });
            localStorage.setItem('admin_history', JSON.stringify(history));
            
            originalContent = content;
            updateIndicator();
        }

        document.getElementById('editor').addEventListener('input', function() {
            isDirty = true;
            updateIndicator();
            if (saveTimeout) clearTimeout(saveTimeout);
            saveTimeout = setTimeout(autoSave, 1000);
        });

        window.addEventListener('beforeunload', function() {
            if (currentPage) autoSave();
        });

        function downloadContent() {
            const content = getContent();
            if (!content) {
                showNotification('No content to download', 'error');
                return;
            }
            
            const fullDocument = document.querySelector('html').outerHTML;
            const parser = new DOMParser();
            const doc = parser.parseFromString(fullDocument, 'text/html');
            
            const bodyContent = doc.querySelector('body');
            bodyContent.innerHTML = content;
            const fullHtml = doc.documentElement.outerHTML;
            
            const blob = new Blob([fullHtml], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = currentPage;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showNotification('File downloaded! Save it to your VS Code projects folder.', 'success');
        }

        function previewContent() {
            const content = getContent();
            if (!content) {
                showNotification('No content to preview', 'error');
                return;
            }
            document.getElementById('previewContent').innerHTML = content;
            document.getElementById('previewModal').classList.add('active');
        }

        function closePreview() {
            document.getElementById('previewModal').classList.remove('active');
        }

        function cancelEdit() {
            document.getElementById('editor').innerHTML = originalContent;
            isDirty = false;
            updateIndicator();
            showNotification('Changes cancelled', 'success');
        }

        function restoreVersion() {
            const history = JSON.parse(localStorage.getItem('admin_history') || '{}');
            if (!history[currentPage] || history[currentPage].length === 0) {
                showNotification('No previous versions available', 'error');
                return;
            }
            
            const versions = history[currentPage].slice().reverse();
            let versionHtml = '<select onchange="restoreSpecificVersion(this.value)"><option value="">Select version...</option>';
            versions.forEach((v, i) => {
                const date = new Date(v.timestamp).toLocaleString();
                versionHtml += `<option value="${i}">${date}</option>`;
            });
            versionHtml += '</select>';
            document.getElementById('previewContent').innerHTML = versionHtml;
            document.getElementById('previewModal').classList.add('active');
        }
        
        function restoreSpecificVersion(index) {
            const history = JSON.parse(localStorage.getItem('admin_history') || '{}');
            if (!history[currentPage] || history[currentPage].length === 0) return;
            
            const versions = history[currentPage].slice().reverse();
            if (index === '' || index === undefined) {
                document.getElementById('previewModal').classList.remove('active');
                return;
            }
            
            const prevContent = versions[parseInt(index)].content;
            if (confirm('Restore this version? This will overwrite current changes.')) {
                originalContent = prevContent;
                document.getElementById('editor').innerHTML = prevContent;
                localStorage.setItem('admin_saved_' + currentPage, prevContent);
                document.getElementById('previewModal').classList.remove('active');
                isDirty = false;
                updateIndicator();
                showNotification('Previous version restored', 'success');
            }
        }

        function publishContent() {
            showNotification('Content auto-saved! Click Download to save file.', 'success');
        }

        function showNotification(message, type) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = 'notification ' + type + ' show';
        }

        document.getElementById('logoutBtn').addEventListener('click', function() {
            document.getElementById('loginContainer').style.display = 'flex';
            document.getElementById('adminContainer').classList.remove('active');
            document.getElementById('editor').innerHTML = '';
        });
    </script>
</body>
</html>
